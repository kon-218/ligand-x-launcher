# GENERATED FILE. Edit ligand-x/docker-compose.yml and rerun the stable topology renderer.
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
x-runtime-app-env: APP_ENV=${APP_ENV:-production}
x-runtime-username: LIGANDX_USERNAME=${LIGANDX_USERNAME:-admin}
x-runtime-password: LIGANDX_PASSWORD=${LIGANDX_PASSWORD:-}
x-runtime-internal-secret: INTERNAL_WORKER_SECRET=${INTERNAL_WORKER_SECRET:?Set INTERNAL_WORKER_SECRET
  (see .env.example)}
x-runtime-image-digest: LIGANDX_IMAGE_DIGEST=${LIGANDX_IMAGE_DIGEST:-}
x-runtime-gateway-url: GATEWAY_URL=http://gateway:8000
services:
  scientific-output-init:
    image: alpine:3.21
    command:
    - sh
    - -ec
    - "case \"$${SCIENTIFIC_OUTPUT_GID}\" in\n  ''|*[!0-9]*) echo \"SCIENTIFIC_OUTPUT_GID\
      \ must be numeric\" >&2; exit 64 ;;\nesac\nfor root in /app/data/abfe_outputs\
      \ /app/data/rbfe_outputs; do\n  mkdir -p \"$${root}/jobs\"\n  chgrp -R \"$${SCIENTIFIC_OUTPUT_GID}\"\
      \ \"$${root}\"\n  find \"$${root}\" -type d -exec chmod u+rwx,g+rwx,g+s,o-rwx\
      \ {} +\n  find \"$${root}\" -type f -exec chmod u+rw,g+rw,o-rwx {} +\ndone\n"
    environment:
      SCIENTIFIC_OUTPUT_GID: ${LIGANDX_SCIENTIFIC_OUTPUT_GID:-2000}
    user: 0:0
    volumes:
    - abfe_outputs:/app/data/abfe_outputs
    - rbfe_outputs:/app/data/rbfe_outputs
    restart: 'no'
  scientific-artifact-init:
    image: alpine:3.21
    command:
    - sh
    - -ec
    - mkdir -p /app/data/scientific_artifacts && chmod 1777 /app/data/scientific_artifacts
      && find /app/data/scientific_artifacts -mindepth 1 -maxdepth 1 -type d -exec
      chmod 1777 {} +
    user: 0:0
    volumes:
    - scientific_artifacts:/app/data/scientific_artifacts
    restart: 'no'
  runtime-license-init:
    image: alpine:3.21
    command:
    - sh
    - -ec
    - "rm -f /runtime-license/ligandx-license.json /runtime-license/.license.tmp\n\
      if [ -f /host-license/ligandx-license.json ]; then\n  cp /host-license/ligandx-license.json\
      \ /runtime-license/.license.tmp\n  chown \"$${LICENSE_RUNTIME_UID}:$${LICENSE_RUNTIME_GID}\"\
      \ /runtime-license/.license.tmp\n  chmod 0600 /runtime-license/.license.tmp\n\
      \  mv /runtime-license/.license.tmp /runtime-license/ligandx-license.json\n\
      fi\n"
    environment:
      LICENSE_RUNTIME_UID: ${LIGANDX_GATEWAY_UID:-1001}
      LICENSE_RUNTIME_GID: ${LIGANDX_GATEWAY_GID:-1001}
    user: 0:0
    volumes:
    - ./data/license:/host-license:ro
    - runtime_license:/runtime-license
    restart: 'no'
