    - backend
    volumes:
    - celery_beat_data:/app/celery-beat
    environment:
    - APP_ENV=${APP_ENV:-production}
    - LIGANDX_USERNAME=${LIGANDX_USERNAME:-admin}
    - LIGANDX_PASSWORD=${LIGANDX_PASSWORD:-}
    - LIGANDX_DEPLOYMENT_MODE=${LIGANDX_DEPLOYMENT_MODE:-single_user}
    - LIGANDX_ENABLE_PREVIEW_MODULES=${LIGANDX_ENABLE_PREVIEW_MODULES:-false}
    - LIGANDX_ENABLE_EXPERIMENTAL_MODULES=${LIGANDX_ENABLE_EXPERIMENTAL_MODULES:-false}
    - LIGANDX_ENABLE_CHECKPOINT_PAUSE=${LIGANDX_ENABLE_CHECKPOINT_PAUSE:-false}
    - CELERY_BROKER_URL=${CELERY_BROKER_URL:-amqp://ligandx:${RABBITMQ_PASSWORD:?Must
      set RABBITMQ_PASSWORD}@rabbitmq:5672/}
    - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD
      must be set}@redis:6379/0}
    - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set (e.g. postgresql://ligandx:password@postgres:5432/ligandx)}
    - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0}
    depends_on:
      celery-beat-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - celery
      - -A
      - lib.tasks.gpu_tasks
      - inspect
      - active_queues
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${CELERY_BEAT_CPU_LIMIT:-1}
          memory: ${CELERY_BEAT_MEM_LIMIT:-1G}
        reservations:
          cpus: ${CELERY_BEAT_CPU_RES:-0.5}
          memory: ${CELERY_BEAT_MEM_RES:-256M}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ligandx-rabbitmq
    hostname: rabbitmq
    networks:
    - backend
    ports:
    - 127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672
    environment:
    - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?RABBITMQ_USER must be set}
    - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
    - RABBITMQ_DEFAULT_VHOST=/
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${RABBITMQ_CPU_LIMIT:-2}
          memory: ${RABBITMQ_MEM_LIMIT:-4G}
        reservations:
          cpus: ${RABBITMQ_CPU_RES:-0.5}
          memory: ${RABBITMQ_MEM_RES:-1G}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  redis:
    image: redis:7-alpine
    container_name: ligandx-redis
    hostname: redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --appendonly yes --appendfsync everysec
    networks:
    - backend
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPU_LIMIT:-1}
          memory: ${REDIS_MEM_LIMIT:-2G}
        reservations:
          cpus: ${REDIS_CPU_RES:-0.25}
          memory: ${REDIS_MEM_RES:-512M}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  postgres:
    image: postgres:16-alpine
    container_name: ligandx-postgres
    networks:
    - backend
    environment:
    - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" && PGPASSWORD="$$POSTGRES_PASSWORD"
        psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "SELECT 1" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-2}
          memory: ${POSTGRES_MEM_LIMIT:-4G}
        reservations:
          cpus: ${POSTGRES_CPU_RES:-0.5}
          memory: ${POSTGRES_MEM_RES:-1G}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  flower:
    image: mher/flower:2.0
    container_name: ligandx-flower
    command: celery flower --port=5555 --url_prefix=flower
    networks:
    - backend
    - frontend
    ports:
    - 127.0.0.1:${FLOWER_PORT:-5555}:5555
    environment:
    - CELERY_BROKER_URL=amqp://ligandx:${RABBITMQ_PASSWORD:?Must set RABBITMQ_PASSWORD}@rabbitmq:5672/
    - FLOWER_BROKER_API=http://ligandx:${RABBITMQ_PASSWORD:?Must set RABBITMQ_PASSWORD}@rabbitmq:15672/api/
    - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD
      must be set}@redis:6379/0}
    - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?Set FLOWER_PASSWORD
      in .env or .env.production}
    - FLOWER_PERSISTENT=true
    - FLOWER_MAX_TASKS=10000
    - FLOWER_SHOW_POOL=true
    - FLOWER_TASK_TRACK_STARTED=true
    - FLOWER_REFRESH_INTERVAL=5000
    volumes:
    - ./config/flower_config.py:/app/flower_config.py:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:5555/flower/healthcheck',
        timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${FLOWER_CPU_LIMIT:-1}
          memory: ${FLOWER_MEM_LIMIT:-1G}
        reservations:
          cpus: ${FLOWER_CPU_RES:-0.25}
          memory: ${FLOWER_MEM_RES:-256M}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  proxy:
    image: nginx:1.27-alpine
    container_name: ligandx-proxy
    ports:
    - ${LIGANDX_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80
    networks:
    - frontend
    volumes:
    - ./docker/nginx/ligandx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  frontend:
    image: ghcr.io/kon-218/ligand-x/frontend:${VERSION:-latest}
    command:
    - bun
    - run
    - start
    networks:
    - frontend
    ports:
    - ${LIGANDX_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000
    environment:
    - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${FRONTEND_CPU_LIMIT:-2}
          memory: ${FRONTEND_MEM_LIMIT:-4G}
        reservations:
          cpus: ${FRONTEND_CPU_RES:-0.5}
          memory: ${FRONTEND_MEM_RES:-1G}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  docking_outputs: null
  md_outputs: null
  abfe_outputs: null
  rbfe_outputs: null
  boltz_outputs: null
  qc_jobs: null
  qc_results: null
  msa_cache: null
  runtime_settings: null
  runtime_license: null
  scientific_artifacts: null
  reinvent_campaigns: null
  redis_data: null
  postgres_data: null
  rabbitmq_data: null
  celery_beat_data: null
