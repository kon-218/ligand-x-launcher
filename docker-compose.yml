    command:
    - gateway
    ports:
    - ${LIGANDX_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8000}:8000
    networks:
    - frontend
    - backend
    environment:
    - APP_ENV=${APP_ENV:-production}
    - LIGANDX_USERNAME=${LIGANDX_USERNAME:-admin}
    - LIGANDX_PASSWORD=${LIGANDX_PASSWORD:-}
    - LIGANDX_DEPLOYMENT_MODE=${LIGANDX_DEPLOYMENT_MODE:-single_user}
    - LIGANDX_ENABLE_PREVIEW_MODULES=${LIGANDX_ENABLE_PREVIEW_MODULES:-false}
